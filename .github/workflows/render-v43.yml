name: Render Attention V4.3 55 Rules

on:
  push:
    branches: [main]
    paths:
      - 'src/v43-film.tsx'
      - 'src/v43-index.tsx'
      - 'scripts/make_audio_v43.py'
      - 'v43-motion-plan.json'
      - 'director/v43-director-preview.html'
      - 'docs/v43-55-rules.md'
      - '.github/workflows/render-v43.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          npm install --no-audit --no-fund

      - name: Hard-rule structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/v43-film.tsx').read_text(encoding='utf-8')
          forbidden=['ContinuityBridge','CarrierContinuity','MicroShake','seconds=[8','starts=[']
          bad=[x for x in forbidden if x in s]
          assert not bad, f'Forbidden V4.1/V4.2 patterns found: {bad}'
          required=['QuietBadge','SignalCarrier','AuctionWorkCarrier','NetworkTrackFork','ChoicePaperCarrier','FinalGrowth']
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing V4.3 directing structures: {missing}'
          plan=Path('v43-motion-plan.json').read_text(encoding='utf-8')
          for token in ['"fixed_8_second_pages": false','"generic_transition_overlay": false','"real_quiet_holds": true','"encoded_mp4_must_be_checked": true']:
              assert token in plan, f'Missing hard-rule plan token: {token}'
          print('V4.3 P0 structural gate passed')
          PY

      - name: Generate V4.3 soundtrack
        run: python3 scripts/make_audio_v43.py public/v43-score.wav

      - name: Verify V4.3 composition
        run: npx remotion compositions src/v43-index.tsx

      - name: Render P0 rhythm proofs
        run: |
          mkdir -p out/v43-proofs
          for pair in             "006.2:186" "008.6:258" "018.9:567"             "028.8:864" "031.2:936" "040.8:1224"             "051.8:1554" "064.5:1935" "077.2:2316"             "088.7:2661" "090.5:2715" "099.8:2994"             "108.0:3240" "114.8:3444" "118.8:3564"; do
            name="${pair%%:*}"
            frame="${pair##*:}"
            npx remotion still src/v43-index.tsx AttentionV43 "out/v43-proofs/${name}s.png" --frame="${frame}" --image-format=png
          done

      - name: Build V4.3 proof contact sheet
        run: |
          ffmpeg -y -pattern_type glob -i 'out/v43-proofs/*.png'             -vf "scale=640:-1,tile=3x5:padding=7:margin=7:color=0x050709"             -frames:v 1 out/v43-proof-contact.jpg

      - name: Render transition review windows
        run: |
          npx remotion render src/v43-index.tsx AttentionV43 out/v43-review-00-42.mp4             --codec=h264 --crf=18 --concurrency=2 --frames=0-1260
          npx remotion render src/v43-index.tsx AttentionV43 out/v43-review-90-120.mp4             --codec=h264 --crf=18 --concurrency=2 --frames=2700-3599

      - name: Render V4.3 full MP4
        run: |
          npx remotion render src/v43-index.tsx AttentionV43 out/attention-is-all-you-need-v4-3.mp4             --codec=h264 --crf=17 --concurrency=2

      - name: Media checks
        run: |
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,width,height,r_frame_rate             -of json out/attention-is-all-you-need-v4-3.mp4 | tee out/v43-media-info.json
          ffmpeg -v error -i out/attention-is-all-you-need-v4-3.mp4 -f null -

      - name: Extract encoded boundary frames
        run: |
          mkdir -p out/v43-encoded
          for t in 8.1 8.6 9.1 19.2 19.8 20.4 31.0 31.6 32.2 41.5 42.0 42.6 53.1 53.7 54.3 65.4 66.0 66.6 78.0 78.6 79.2 89.6 90.2 90.8 100.0 100.6 101.2 108.4 109.0 109.6 115.5 116.1 116.7; do
            ffmpeg -y -ss "$t" -i out/attention-is-all-you-need-v4-3.mp4 -frames:v 1 "out/v43-encoded/${t}s.png" >/dev/null 2>&1
          done
          ffmpeg -y -pattern_type glob -i 'out/v43-encoded/*.png'             -vf "scale=480:-1,tile=3x11:padding=6:margin=6:color=0x050709"             -frames:v 1 out/v43-encoded-boundaries.jpg

      - name: Upload V4.3
        uses: actions/upload-artifact@v4
        with:
          name: attention-v4-3-55-rules
          path: |
            out/attention-is-all-you-need-v4-3.mp4
            out/v43-review-00-42.mp4
            out/v43-review-90-120.mp4
            out/v43-proof-contact.jpg
            out/v43-proofs/*.png
            out/v43-encoded-boundaries.jpg
            out/v43-encoded/*.png
            out/v43-media-info.json
            v43-motion-plan.json
            director/v43-director-preview.html
            docs/v43-55-rules.md
          retention-days: 7

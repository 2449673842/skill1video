name: Render Attention V4.2 Directed Rhythm

on:
  push:
    branches: [main]
    paths:
      - 'src/v3-opening.tsx'
      - 'src/v3-index.tsx'
      - 'src/v3-scenes-a.tsx'
      - 'src/v2-common.tsx'
      - 'src/v2-scenes-a.tsx'
      - 'src/v2-scenes-b.tsx'
      - 'src/v2-scenes-c.tsx'
      - 'scripts/make_audio.py'
      - '.github/workflows/render-v3.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          npm install --no-audit --no-fund

      - name: Generate V4.2 soundtrack
        run: python3 scripts/make_audio.py public/score.wav

      - name: Verify composition
        run: npx remotion compositions src/v3-index.tsx

      - name: Render rhythm proof frames
        run: |
          mkdir -p out/v4-2-rhythm
          for pair in             "015.6:468" "016.2:486"             "024.8:744" "026.0:780"             "031.4:942" "032.2:966"             "050.3:1509" "051.1:1533"             "061.6:1848" "062.4:1872"             "079.0:2370" "079.8:2394"             "096.8:2904" "098.6:2958"             "100.6:3018" "108.7:3261"             "111.4:3342" "116.8:3504"; do
            name="${pair%%:*}"
            frame="${pair##*:}"
            npx remotion still src/v3-index.tsx AttentionV3 "out/v4-2-rhythm/${name}s.png" --frame="${frame}" --image-format=png
          done

      - name: Rhythm contact sheet
        run: |
          ffmpeg -y -pattern_type glob -i 'out/v4-2-rhythm/*.png'             -vf "scale=640:-1,tile=3x6:padding=7:margin=7:color=0x07090B"             -frames:v 1 out/v4-2-rhythm-contact.jpg

      - name: Render first 40s review
        run: |
          npx remotion render src/v3-index.tsx AttentionV3 out/attention-v4-2-first-40s.mp4             --codec=h264 --crf=17 --concurrency=2 --frames=0-1199

      - name: Render middle rhythm review
        run: |
          npx remotion render src/v3-index.tsx AttentionV3 out/attention-v4-2-middle-40s.mp4             --codec=h264 --crf=17 --concurrency=2 --frames=1200-2399

      - name: Render final rhythm review
        run: |
          npx remotion render src/v3-index.tsx AttentionV3 out/attention-v4-2-final-40s.mp4             --codec=h264 --crf=17 --concurrency=2 --frames=2400-3599

      - name: Render V4.2 MP4
        run: |
          npx remotion render src/v3-index.tsx AttentionV3 out/attention-is-all-you-need-v4-2.mp4             --codec=h264 --crf=17 --concurrency=2

      - name: Media checks
        run: |
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,width,height,r_frame_rate             -of json out/attention-is-all-you-need-v4-2.mp4 | tee out/v4-2-media-info.json
          ffmpeg -v error -i out/attention-is-all-you-need-v4-2.mp4 -f null -

      - name: Upload V4.2
        uses: actions/upload-artifact@v4
        with:
          name: attention-v4-2-directed-rhythm
          path: |
            out/attention-is-all-you-need-v4-2.mp4
            out/attention-v4-2-first-40s.mp4
            out/attention-v4-2-middle-40s.mp4
            out/attention-v4-2-final-40s.mp4
            out/v4-2-rhythm-contact.jpg
            out/v4-2-rhythm/*.png
            out/v4-2-media-info.json
          retention-days: 7

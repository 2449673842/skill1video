name: Render Attention V2 Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          npm install --no-audit --no-fund
      - name: Generate soundtrack
        run: python3 scripts/make_audio.py public/score.wav
      - name: Verify V2
        run: npx remotion compositions src/v2-index.tsx
      - name: Render V2 keyframes
        run: |
          mkdir -p out/v2-keyframes
          for pair in "003:90" "011:330" "019:570" "027:810" "035:1050" "043:1290" "059:1770" "075:2250" "091:2730" "107:3210" "116:3480"; do
            name="${pair%%:*}"
            frame="${pair##*:}"
            npx remotion still src/v2-index.tsx AttentionV2 "out/v2-keyframes/${name}s.png" --frame="${frame}" --image-format=png
          done
      - name: Contact sheet
        run: |
          ffmpeg -y -pattern_type glob -i 'out/v2-keyframes/*.png'             -vf "scale=768:-1,tile=2x6:padding=8:margin=8:color=0x111111"             -frames:v 1 out/v2-contact-sheet.jpg
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: attention-v2-preview
          path: |
            out/v2-contact-sheet.jpg
            out/v2-keyframes/*.png
          retention-days: 7
